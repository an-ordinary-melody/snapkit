name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['site/**', 'docs/**'] # the website deploys on Vercel; tags always build
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: Snapkit-mac
            files: dist/*.dmg
          - os: windows-latest
            script: build:win
            artifact: Snapkit-windows
            files: dist/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Packaged app starts (Windows), and its log
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/win-unpacked/Snapkit.exe -PassThru
          Start-Sleep -Seconds 10
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-ChildItem "$env:APPDATA\Snapkit\logs" -ErrorAction SilentlyContinue
          Get-Content "$env:APPDATA\Snapkit\logs\main.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
      - name: What Windows shows as the app's name and publisher
        if: runner.os == 'Windows'
        shell: pwsh
        run: (Get-Item dist/win-unpacked/Snapkit.exe).VersionInfo | Format-List FileDescription, ProductName, CompanyName, LegalCopyright
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v7 # for release-notes/<tag>.md
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          body_path: release-notes/${{ github.ref_name }}.md
          # A tag with a dash (v0.2.0-beta.1) is a beta: a GitHub pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
      # The website (site/) reads the newest release when it builds: rebuild it so the
      # download buttons and changelog show this one, then check the live site really offers
      # this version, and try once more if not. Skipped until the secret is set.
      - name: Redeploy the website
        if: env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for attempt in 1 2; do
            [ "$attempt" = 2 ] && sleep 30
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
            for i in $(seq 1 30); do
              sleep 10
              if curl -fsS https://snapkit-app.vercel.app/ | grep -q "Snapkit-${VERSION#v}-mac-arm64.dmg"; then
                echo "The website now offers ${VERSION}."
                exit 0
              fi
            done
            echo "The website doesn't show ${VERSION} yet (attempt ${attempt})."
          done
          echo "::warning::The website still doesn't offer ${VERSION}. Run Actions → Redeploy website."
