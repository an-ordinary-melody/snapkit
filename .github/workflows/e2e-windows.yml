name: E2E (Windows)

# Runs end-to-end suites on a real Windows machine, by hand (Actions → E2E (Windows) → Run workflow).
on:
  workflow_dispatch:
    inputs:
      suites:
        description: Suites to run (space-separated)
        default: pin fullscreen hotkeys regressions
        required: false

jobs:
  e2e:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 100% and 150% display scaling (most Windows laptops run at 125–150%).
        scale: ['1', '1.5']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: OCR languages (installed, and the packs Windows offers)
        shell: pwsh
        run: |
          if (Test-Path build/ocr/snapkit-ocr.exe) { "Can read now: $(./build/ocr/snapkit-ocr.exe --languages)" }
          Get-WindowsCapability -Online -Name 'Language.OCR*' | Select-Object Name, State | Format-Table -AutoSize | Out-String -Width 200
      - name: Run suites
        shell: bash
        env:
          SNAPKIT_E2E_ARGS: ${{ matrix.scale != '1' && format('--force-device-scale-factor={0}', matrix.scale) || '' }}
        run: node e2e/run-all.mjs ${{ github.event.inputs.suites }} --out e2e-out
      - name: Main-process log
        if: always()
        shell: bash
        run: cat "$APPDATA/Snapkit/logs/main.log" 2>/dev/null || find "$APPDATA" -name "main.log" -path "*Snapkit*" -exec cat {} \; 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-windows-scale-${{ matrix.scale }}
          path: e2e-out
