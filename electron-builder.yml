appId: com.charios.snapkit
productName: Snapkit
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: .
    filter: ["*.png"]
asarUnpack:
  - "**/*.node"
npmRebuild: false
afterPack: build/after-pack.cjs # Electron fuses + macOS ad-hoc signing
# Snapkit's UI is English: keep only Chromium's English language packs (Windows: locales/*.pak;
# macOS packs are inside the Electron framework, trimmed in build/after-pack.cjs).
electronLanguages: [en-US, en-GB]

mac:
  # Liquid Glass icon (macOS 26+): build/Assets.car, compiled from build/AppIcon.icon by the
  # "Mac icon" workflow, plus the flattened AppIcon.icns it makes for older macOS.
  icon: build/AppIcon.icns
  extraResources:
    - from: build/Assets.car
      to: Assets.car
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity
  identity: null # no Apple Developer account: ad-hoc signed in afterPack instead
  extendInfo:
    CFBundleIconName: AppIcon # the icon in Assets.car (Liquid Glass)
    LSUIElement: true
    LSAppNapIsDisabled: true # App Nap made idle captures take seconds to start
    NSScreenCaptureUsageDescription: Snapkit needs to record the screen to take screenshots.
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  format: UDBZ # bzip2: the smallest of the formats tried (76 MB vs 83 MB zlib, 82 MB LZFSE)

win:
  icon: build/icon-win.png # full-size tile (build/icon.png is inset for macOS); made by scripts/make-icons.cjs
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

linux:
  target: [dir]
